<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Private Mesh</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-size: cover; background-position: center; }
        .glass-box { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 25px; border-radius: 18px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h1 { text-align: center; margin-bottom: 5px; font-size: 26px; color: #38bdf8; letter-spacing: 1.5px; }
        .dev-tag { text-align: center; font-size: 11px; color: #94a3b8; margin-bottom: 20px; }
        input, button, select { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
        input, select { background: rgba(15, 23, 42, 0.6); color: #fff; border: 1px solid #334155; }
        button { background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        #chat-screen { display: none; flex-direction: column; height: 85vh; width: 95%; max-width: 600px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(14px); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .chat-header { background: rgba(15, 23, 42, 0.9); padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; color: #38bdf8; }
        .chat-header button { width: auto; padding: 6px 12px; font-size: 12px; background: #334155; margin-top: 0; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: rgba(30, 41, 59, 0.85); padding: 10px 14px; border-radius: 10px; max-width: 75%; word-break: break-word; border: 1px solid #334155; }
        .message.self { background: rgba(3, 105, 161, 0.85); align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid #334155; }
        .chat-input-area input { margin-top: 0; flex: 1; border-radius: 8px 0 0 8px; }
        .chat-input-area button { margin-top: 0; width: 80px; border-radius: 0 8px 8px 0; }
        /* Settings Modal */
        #settings-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .settings-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 85%; max-width: 350px; border: 1px solid #475569; }
        .error-msg { color: #f43f5e; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="glass-box">
        <h1>🌪️ Vortex</h1>
        <div class="dev-tag">Made with ❤️ by Asmit Singh</div>
        <input type="password" id="room-code" placeholder="Enter Secret Code">
        <input type="text" id="username" placeholder="Enter Your Nickname" style="display:none;">
        <button id="action-btn" onclick="handleAuth()">Access Vortex</button>
        <div id="error" class="error-msg"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div class="chat-header">
            <span>🌪️ Vortex - Secure Lounge</span>
            <button onclick="toggleSettings()">Settings ⚙️</button>
        </div>
        <div id="messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="settings-content">
            <h3 style="margin-bottom: 15px; color: #38bdf8;">⚙️ Vortex Settings</h3>
            <label style="font-size: 14px; color: #cbd5e1;">Change Nickname:</label>
            <input type="text" id="new-username" placeholder="New nickname">
            
            <label style="font-size: 14px; color: #cbd5e1; margin-top: 15px; display: block;">Theme / Background URL:</label>
            <input type="text" id="bg-url" placeholder="Paste Image URL for BG">
            
            <button onclick="saveSettings()" style="background: #10b981; margin-top: 15px;">Save Changes</button>
            <button onclick="toggleSettings()" style="background: #64748b; margin-top: 8px;">Close</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let step = 1;
        let myName = "";

        function handleAuth() {
            const err = document.getElementById('error');
            if (step === 1) {
                const code = document.getElementById('room-code').value;
                socket.emit('verify-code', code);
            } else if (step === 2) {
                const name = document.getElementById('username').value.trim();
                if (!name) {
                    err.innerText = "Please enter a valid nickname!";
                    return;
                }
                myName = name;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
            }
        }

        socket.on('code-success', () => {
            step = 2;
            document.getElementById('room-code').style.display = 'none';
            document.getElementById('username').style.display = 'block';
            document.getElementById('action-btn').innerText = "Join Vortex";
            document.getElementById('error').innerText = "";
        });

        socket.on('code-fail', () => {
            document.getElementById('error').innerText = "Wrong Code! Access Denied.";
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('chat-message', { name: myName, text: text });
                input.value = "";
            }
        }

        socket.on('broadcast-message', (data) => {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${data.name === myName ? 'self' : ''}`;
            div.innerHTML = `<strong>${data.name}:</strong> ${data.text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSettings() {
            const newName = document.getElementById('new-username').value.trim();
            const bgUrl = document.getElementById('bg-url').value.trim();
            
            if (newName) {
                myName = newName;
                alert('Nickname updated successfully!');
            }
            if (bgUrl) {
                document.body.style.backgroundImage = `url('${bgUrl}')`;
            }
            toggleSettings();
        }
    </script>
</body>
</html>
