<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Secure Mesh</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #000000; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-size: cover; background-position: center; }
        .glass-box { background: rgba(10, 10, 12, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; border-radius: 12px; width: 90%; max-width: 380px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); }
        h1 { text-align: center; margin-bottom: 4px; font-size: 24px; color: #f8fafc; letter-spacing: 1px; font-weight: 600; }
        .dev-tag { text-align: center; font-size: 11px; color: #64748b; margin-bottom: 24px; letter-spacing: 0.5px; }
        input, button, select { width: 100%; padding: 12px; margin-top: 12px; border-radius: 6px; border: none; font-size: 15px; outline: none; }
        input, select { background: rgba(20, 20, 25, 0.8); color: #fff; border: 1px solid #262630; }
        input:focus { border-color: #3b82f6; }
        button { background: #ffffff; color: #000000; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #e2e8f0; }
        button:active { transform: scale(0.99); }
        #chat-screen { display: none; flex-direction: column; height: 85vh; width: 95%; max-width: 600px; background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); }
        .chat-header { background: rgba(15, 15, 20, 0.9); padding: 14px 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #22222c; color: #f8fafc; font-size: 15px; }
        .chat-header button { width: auto; padding: 6px 12px; font-size: 12px; background: #262630; color: #fff; margin-top: 0; border: 1px solid #3f3f46; }
        .chat-header button:hover { background: #3f3f46; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { background: #18181b; padding: 10px 14px; border-radius: 8px; max-width: 75%; word-break: break-word; border: 1px solid #27272a; font-size: 14px; }
        .message.self { background: #27272a; align-self: flex-end; border-color: #3f3f46; }
        .chat-input-area { display: flex; padding: 12px; background: rgba(15, 15, 20, 0.9); border-top: 1px solid #22222c; gap: 8px; }
        .chat-input-area input { margin-top: 0; flex: 1; border-radius: 6px; }
        .chat-input-area button { margin-top: 0; width: 80px; border-radius: 6px; }
        #settings-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; }
        .settings-content { background: #121216; padding: 24px; border-radius: 12px; width: 85%; max-width: 340px; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .settings-content h3 { font-size: 16px; margin-bottom: 16px; color: #f8fafc; font-weight: 600; }
        .settings-content label { font-size: 13px; color: #a1a1aa; }
        .error-msg { color: #ef4444; text-align: center; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div id="auth-screen" class="glass-box">
        <h1>Vortex</h1>
        <div class="dev-tag">Made with ❤️ by Asmit Singh</div>
        <input type="password" id="room-code" placeholder="Enter Secret Code">
        <input type="text" id="username" placeholder="Enter Your Nickname" style="display:none;">
        <button id="action-btn" onclick="handleAuth()">Access Vortex</button>
        <div id="error" class="error-msg"></div>
    </div>
    <div id="chat-screen">
        <div class="chat-header">
            <span>Vortex Secure Lounge</span>
            <button onclick="toggleSettings()">Settings</button>
        </div>
        <div id="messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div id="settings-modal">
        <div class="settings-content">
            <h3>Vortex Settings</h3>
            <label>Change Nickname:</label>
            <input type="text" id="new-username" placeholder="New nickname">
            <label style="margin-top: 14px; display: block;">Theme Background URL:</label>
            <input type="text" id="bg-url" placeholder="Paste image URL">
            <button onclick="saveSettings()" style="background: #ffffff; color: #000; margin-top: 16px;">Save Changes</button>
            <button onclick="toggleSettings()" style="background: #27272a; color: #fff; margin-top: 8px;">Close</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let step = 1;
        let myName = "";
        function handleAuth() {
            const err = document.getElementById('error');
            if (step === 1) {
                const code = document.getElementById('room-code').value;
                socket.emit('verify-code', code);
            } else if (step === 2) {
                const name = document.getElementById('username').value.trim();
                if (!name) { err.innerText = "Please enter a valid nickname!"; return; }
                myName = name;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
            }
        }
        socket.on('code-success', () => {
            step = 2;
            document.getElementById('room-code').style.display = 'none';
            document.getElementById('username').style.display = 'block';
            document.getElementById('action-btn').innerText = "Join Lounge";
            document.getElementById('error').innerText = "";
        });
        socket.on('code-fail', () => {
            document.getElementById('error').innerText = "Wrong Code. Access Denied.";
        });
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('chat-message', { name: myName, text: text });
                input.value = "";
            }
        }
        socket.on('broadcast-message', (data) => {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${data.name === myName ? 'self' : ''}`;
            div.innerHTML = `<strong>${data.name}:</strong> ${data.text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
        function saveSettings() {
            const newName = document.getElementById('new-username').value.trim();
            const bgUrl = document.getElementById('bg-url').value.trim();
            if (newName) { myName = newName; alert('Nickname updated successfully'); }
            if (bgUrl) { document.body.style.backgroundImage = `url('${bgUrl}')`; }
            toggleSettings();
        }
    </script>
</body>
</html>
