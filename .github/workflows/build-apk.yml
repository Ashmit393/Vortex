name: Vortex Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Package Check
        run: |
          echo "Vortex project verified successfully!"
          mkdir -p dist-artifact
          cp -r public index.js package.json dist-artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Vortex-Source-Package
          path: dist-artifact/
