name: Build and Release APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build TWA / APK package
        uses: pwabuilder/pwabuilder-action@main
        with:
          url: 'https://ashmit393.github.io/Vortex/' # या तेरा लाइव वेब URL
          pwaConfig: ''

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: Vortex-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            output/
